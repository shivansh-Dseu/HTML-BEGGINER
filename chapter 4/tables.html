<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tables -HTML</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #f9f9f9;
        }

        h1 {
            color: #333;
        }

        table {
            width: 100%;
            max-width: 600px;
            border-collapse: collapse;
            margin-top: 20px;
            background-color: #ffffff;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        th,
        td {
            border: 1px solid #dddddd;
            padding: 12px;
            text-align: left;
        }

        th:first-child,
        td:first-child,
        th:nth-child(3),
        td:nth-child(3) {
            text-align: center;
        }

        thead th {
            background-color: #007acc;
            color: white;
            font-weight: bold;
        }

        tbody tr:nth-child(even) {
            background-color: #f2f2f2;
        }

        tbody tr:hover {
            background-color: #e9e9e9;
        }
    </style>
</head>

<body>
    <h1>Tables in HTML</h1>
    <table>
        <!-- head of table -->
        <thead>
            <tr>
                <th>Sr. No.</th>
                <th>Name</th>
                <th>Age</th>
                <th>City</th>
            </tr>
        </thead>
        <!-- body of table -->

        <body>
            <tr>
                <td>1</td>
                <td>Shivansh</td>
                <td>17</td>
                <td>New Delhi</td>
            </tr>
            <tr>
                <td>2</td>
                <td>Gourav</td>
                <td>17</td>
                <td>New Delhi</td>
            </tr>
            <tr>
                <td>3</td>
                <td>Aryan</td>
                <td>17</td>
                <td>New Delhi</td>
            </tr>
        </body>

    </table>
</body>

</html>
